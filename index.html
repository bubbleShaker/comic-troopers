<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ下まで canvas を広げる。
         user-scalable=no: 二本指ピンチや誤ダブルタップでの拡大を止める。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#171335" />
    <meta name="description" content="スマホで1分だけ遊べる、コミック調の3Dシューター" />
    <title>COMIC TROOPERS</title>
    <!-- 外部ファイルを増やさず 404 も出さないよう、favicon は data URI で埋め込む -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312101a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle'%3E%F0%9F%92%A5%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --ink: #140f1c;
        --paper: #f7f4ff;
        --accent: #ffd23f;
        --danger: #ff4757;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app,
      #app canvas {
        /* touch-action / overscroll-behavior は継承しないので、実際にタッチを受ける
           canvas まで個別に指定する。これが無いとスワイプをブラウザのスクロールや
           引っ張り更新に奪われ、ドラッグ中の pointer イベントが打ち切られる。 */
        touch-action: none;
        overscroll-behavior: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #171335;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* コミック調の縁取り文字。SVG を使わず text-shadow の四方向で縁を作る */
      .inked {
        color: var(--paper);
        text-shadow:
          -2px 0 var(--ink),
          2px 0 var(--ink),
          0 -2px var(--ink),
          0 2px var(--ink),
          -2px -2px var(--ink),
          2px -2px var(--ink),
          -2px 2px var(--ink),
          2px 2px var(--ink);
      }

      /* --- プレイ中の表示 --- */
      #hud {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        left: max(0.75rem, env(safe-area-inset-left));
        right: max(0.75rem, env(safe-area-inset-right));
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: start;
        pointer-events: none;
        z-index: 5;
      }
      #hud[hidden] {
        display: none;
      }
      #hud-score {
        font-size: 1.6rem;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 0.02em;
      }
      #hud-time {
        font-size: 2.6rem;
        font-weight: 900;
        font-style: italic;
        line-height: 1;
        color: var(--accent);
      }
      /* 残り10秒を切ったら色で知らせる */
      #hud-time[data-rush="true"] {
        color: var(--danger);
      }
      #hud-combo {
        justify-self: end;
        text-align: right;
        /* 折り返すと HUD の高さが変わって画面がガタつくので1行に固定する */
        white-space: nowrap;
        font-size: 1.15rem;
        font-weight: 800;
        font-style: italic;
        color: var(--accent);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #hud-combo[data-active="true"] {
        opacity: 1;
      }

      /* --- タイトル / リザルト --- */
      #overlay {
        position: fixed;
        inset: 0;
        display: grid;
        /* 中央には自機が立っているので、文字は上寄せにして重ならないようにする。
           vh ではなく上寄せで逃がすことで、画面が低い端末でも card がはみ出さない。 */
        justify-items: center;
        align-items: start;
        padding: max(9vh, 2rem) 1.5rem 1.5rem;
        overflow-y: auto;
        background: rgba(15, 12, 34, 0.58);
        z-index: 20;
      }
      #overlay[hidden] {
        display: none;
      }
      #overlay-card {
        text-align: center;
        max-width: 22rem;
      }
      #overlay-card h1 {
        font-size: clamp(2rem, 13vw, 3.4rem);
        font-weight: 900;
        font-style: italic;
        line-height: 1.05;
        color: var(--accent);
        letter-spacing: -0.02em;
      }
      #overlay-card h2 {
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        opacity: 0.75;
      }
      #overlay-card .big {
        font-size: clamp(2.8rem, 18vw, 4.5rem);
        font-weight: 900;
        font-style: italic;
        line-height: 1.1;
        color: var(--accent);
      }
      #overlay-card dl {
        display: grid;
        grid-template-columns: auto auto;
        justify-content: center;
        gap: 0.35rem 1.5rem;
        margin: 1.25rem 0;
        font-size: 1rem;
      }
      #overlay-card dt {
        text-align: right;
        opacity: 0.7;
      }
      #overlay-card dd {
        text-align: left;
        font-weight: 800;
      }
      #overlay-card .lead {
        margin: 1rem 0 0;
        font-size: 0.95rem;
        line-height: 1.9;
        opacity: 0.85;
      }
      #overlay-card .tap {
        margin-top: 1.5rem;
        font-size: 1.1rem;
        font-weight: 800;
        animation: blink 1.2s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      /* 端末が「動きを減らす」設定なら点滅させない */
      @media (prefers-reduced-motion: reduce) {
        #overlay-card .tap {
          animation: none;
        }
      }

      /* WebGL コンテキスト消失など、続行不能になった時だけ出す全画面通知 */
      #notice {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 2rem;
        text-align: center;
        line-height: 1.8;
        white-space: pre-line;
        color: #fff;
        background: rgba(18, 16, 26, 0.92);
        font-size: 1rem;
        z-index: 30;
      }
      #notice[data-visible="true"] {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" hidden>
      <div id="hud-score" class="inked">0</div>
      <div id="hud-time" class="inked">60</div>
      <div id="hud-combo" class="inked"></div>
    </div>

    <div id="overlay">
      <!-- スクリプトが読み込まれるまでの数百ミリ秒、空の暗幕にしないための初期表示 -->
      <div id="overlay-card" class="inked"><h1>COMIC<br />TROOPERS</h1></div>
    </div>

    <div id="notice" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
