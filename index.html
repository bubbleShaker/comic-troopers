<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: iPhone のノッチ下まで canvas を広げる。
         user-scalable=no: 二本指ピンチや誤ダブルタップでの拡大を止める。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12101a" />
    <title>COMIC TROOPERS</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #app,
      #app canvas {
        /* touch-action / overscroll-behavior は継承しないので、実際にタッチを受ける
           canvas まで個別に指定する。これが無いとスワイプをブラウザのスクロールや
           引っ張り更新に奪われ、ドラッグ中の pointer イベントが打ち切られる。 */
        touch-action: none;
        overscroll-behavior: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #12101a;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* WebGL コンテキスト消失など、続行不能になった時だけ出す全画面通知 */
      #notice {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 2rem;
        text-align: center;
        line-height: 1.8;
        color: #fff;
        background: rgba(18, 16, 26, 0.92);
        font-size: 1rem;
      }
      #notice[data-visible="true"] {
        display: grid;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="notice" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
